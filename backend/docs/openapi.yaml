openapi: 3.1.0
info:
  title: finy-backend
  version: '1.0'
  description: ''
  summary: Specification for Finy backend API
  contact:
    name: 'Siamion Vayavoda'
servers:
  - url: 'http://localhost:8080'
    description: local
paths:
  /api/v1/auth/register:
    post:
      summary: Register User
      tags:
        - Auth
      operationId: register-user
      description: Create a new user account with a chosen username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: New User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedUser'
        '400':
          description: Invalid Input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopedValidationError'
        '409':
          description: User Already Exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          description: Failed to Create User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      servers: []
components:
  schemas:
    Envelope:
      title: Envelope
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        data:
          type: object
        error:
          type: string
    EnvelopeStatus:
      title: EnvelopeStatus
      type: string
      enum:
        - success
        - failure
    User:
      title: User
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the given user.
        username:
          type: string
          description: User's nickname that identifies them.
        icon_url:
          type: string
          description: Path to the user avatar icon.
        created_at:
          type: string
          description: Timestamp when user firstly signed up.
      required:
        - id
        - username
        - created_at
      examples:
        - id: 142
          username: johndoe
          icon_url: https://finy.by/icons/default.png
          createdAt: '2019-08-24'
    EnvelopedUser:
      title: EnvelopedUser
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    RegisterUserRequest:
      title: RegisterUserRequest
      type: object
      properties:
        username:
          type: string
          description: >-
            Desired username. Must be at least 3 characters long, start with
            a latin letter, and contain only latin letters, digits, '_' and '-'.
          minLength: 3
          pattern: '^[a-zA-Z][a-zA-Z0-9_-]*$'
        password:
          type: string
          description: >-
            Desired password. Must be at least 8 characters long and contain
            only latin letters, digits and special symbols, with at least one
            uppercase letter, one lowercase letter, one digit and one special
            symbol.
          minLength: 8
          format: password
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9])[a-zA-Z0-9^$*.\[\]{}()?"!@#%&/\\,><'':;|_~`+=-]+$'
      required:
        - username
        - password
      examples:
        - username: johndoe
          password: Correct9Horse!
    ValidationErrorField:
      title: ValidationErrorField
      type: object
      properties:
        field:
          $ref: '#/components/schemas/ValidationErrorFieldName'
        code:
          $ref: '#/components/schemas/ValidationErrorCode'
        message:
          type: string
          description: Human-readable explanation of why the parameter is invalid.
      required:
        - field
        - code
        - message
      examples:
        - field: username
          code: username_too_short
          message: username must be at least 3 characters long
        - field: password
          code: password_missing_special_symbol
          message: password must include at least one special symbol
    ValidationErrorFieldName:
      title: ValidationErrorFieldName
      type: string
      description: Name of the request parameter that failed validation.
      enum:
        - username
        - password
    ValidationErrorCode:
      title: ValidationErrorCode
      type: string
      description: Specific rule that a field failed.
      enum:
        - username_too_short
        - username_invalid_start
        - username_invalid_characters
        - password_too_short
        - password_missing_uppercase
        - password_missing_lowercase
        - password_missing_digit
        - password_missing_special_symbol
        - password_invalid_characters
    ValidationError:
      title: ValidationError
      type: object
      properties:
        errors:
          type: array
          description: List of parameters that failed validation.
          items:
            $ref: '#/components/schemas/ValidationErrorField'
      required:
        - errors
    EnvelopedValidationError:
      title: EnvelopedValidationError
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ValidationError'
    SystemComponent:
      title: SystemComponent
      type: string
      enum:
        - "postgres"
    HealthStatus:
      title: HealthStatus
      type: object
      properties:
        is_healthy:
          type: boolean
          description: Flag that shows that all API componenets are healthy or not.
        degraded_components:
          type: array
          description: List of degraded system components.
          items:
            $ref: "#/components/schemas/SystemComponent"
        timestamp:
          type: string
          description: Time when health check was performed.
      required:
        - is_healthy
        - timestamp
    EnvelopedHealthStatus:
      title: EnvelopedHealthStatus
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthStatus'


  securitySchemes:
    jwt-auth:
      type: http
      scheme: bearer
  responses:
    ResponseStatus:
      description: ''
