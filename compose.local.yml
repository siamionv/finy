services:
  postgres:
    image: postgres:16-alpine
    container_name: finy-postgres
    environment:
      POSTGRES_USER: finy_user
      POSTGRES_PASSWORD: 9Q9h7HbMkR3+Fzc1riyGWA==
      POSTGRES_DB: finy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finy_user -d finy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
